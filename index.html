<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Aliansi — ruang minimalis untuk berbagi cerita dan jurnal harian." />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('aliansi-theme') === 'light' ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <script>
      // Chrome Android "Desktop site" menyamarkan HP sebagai viewport lebar.
      // Perangkat sentuh + viewport lebar adalah sinyal yang stabil untuk mode ini.
      (function () {
        var root = document.documentElement
        function detect() {
          var pointerCoarse = window.matchMedia && (matchMedia('(any-pointer: coarse)').matches || matchMedia('(pointer: coarse)').matches)
          var touch = navigator.maxTouchPoints > 0 || 'ontouchstart' in window || pointerCoarse
          var layoutW = window.innerWidth
          if (touch && layoutW > 720) {
            // Zoom dihitung dari rasio viewport asli — bukan angka tetap.
            // Chrome desktop mode mengompres layout ~980px ke layar HP;
            // zoom sekalian dibatasi supaya teks arsip tidak membengkak.
            var vv = window.visualViewport
            var visualW = vv && vv.width ? vv.width : screen.width / (window.devicePixelRatio || 1)
            var zoom = visualW > 0 ? layoutW / visualW : 1
            zoom = Math.max(1, Math.min(2.2, zoom))
            root.dataset.desktopSite = 'true'
            root.style.setProperty('--desktop-zoom', zoom.toFixed(2))
          } else {
            delete root.dataset.desktopSite
            root.style.removeProperty('--desktop-zoom')
          }
        }
        detect()
        window.addEventListener('resize', detect)
        window.addEventListener('orientationchange', detect)
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Aliansi — Ruang Cerita</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
