<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Aliansi — ruang minimalis untuk berbagi cerita dan jurnal harian." />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('aliansi-theme') === 'light' ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <script>
      // Chrome Android "Desktop site": viewport layout jadi ~980px lalu dikecilin
      // ke layar HP. Kembalikan ke ukuran asli dengan zoom terukur.
      (function () {
        var root = document.documentElement
        function detect() {
          var touch = navigator.maxTouchPoints > 0 || 'ontouchstart' in window
          var screenW = (window.screen && window.screen.width) || 0
          var vv = window.visualViewport
          var vvW = vv && vv.width && vv.scale ? vv.width * vv.scale : 0
          var deviceW = screenW && screenW <= 720 ? screenW : vvW || screenW
          var layoutW = window.innerWidth
          if (touch && layoutW > 720 && deviceW && deviceW <= 720) {
            root.dataset.desktopSite = 'true'
            root.style.setProperty(
              '--desktop-zoom',
              String(Math.min(3.2, Math.max(1.5, layoutW / deviceW))),
            )
          } else {
            delete root.dataset.desktopSite
            root.style.removeProperty('--desktop-zoom')
          }
        }
        detect()
        window.addEventListener('resize', detect)
        window.addEventListener('orientationchange', detect)
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Aliansi — Ruang Cerita</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
